mutation CreateUser @auth(level: USER) {
  user_insert(data: {
    id_expr: "auth.uid",
    email: "user@example.com",
    role: "user"
  })
}

mutation UpdateMyUser($displayName: String, $avatarUrl: String) @auth(level: USER) {
  user_update(key: { id_expr: "auth.uid" }, data: { displayName: $displayName, avatarUrl: $avatarUrl })
}

query GetMyUser @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    email
    displayName
    role
  }
}

mutation CreateFeature($title: String!, $description: String!) @auth(level: PUBLIC, insecureReason: "Publicly visible features.") {
  feature_insert(data: { title: $title, description: $description, status: "pending" })
}

mutation UpdateFeature($id: UUID!, $status: String!) @auth(level: USER) {
  feature_update(key: { id: $id }, data: { status: $status })
}

mutation DeleteFeature($id: UUID!) @auth(level: USER) {
  feature_delete(key: { id: $id })
}

query ListFeatures @auth(level: PUBLIC, insecureReason: "Public listing of features.") {
  features(orderBy: [{ title: ASC }]) {
    id
    title
    status
  }
}

query GetFeature($id: UUID!) @auth(level: PUBLIC, insecureReason: "Public access to feature details.") {
  feature(id: $id) {
    title
    description
  }
}

mutation CreateBugReport($title: String!, $description: String!, $featureId: UUID!) @auth(level: USER) {
  bugReport_insert(data: {
    title: $title,
    description: $description,
    severity: "normal",
    status: "open",
    featureId: $featureId,
    reporterId_expr: "auth.uid"
  })
}

mutation UpdateBugReport($id: UUID!, $status: String!) @auth(level: USER) {
  bugReport_update(key: { id: $id }, data: { status: $status })
}

mutation DeleteBugReport($id: UUID!) @auth(level: USER) {
  bugReport_delete(key: { id: $id })
}

query GetBugReport($id: UUID!) @auth(level: USER) {
  bugReport(id: $id) {
    title
    status
  }
}

query ListMyBugReports @auth(level: USER) {
  bugReports(where: { reporterId: { eq_expr: "auth.uid" } }) {
    id
    title
  }
}

mutation CreateFeedback($content: String!, $rating: Int!, $featureId: UUID!) @auth(level: USER) {
  feedback_insert(data: {
    content: $content,
    rating: $rating,
    featureId: $featureId,
    userId_expr: "auth.uid",
    createdAt_expr: "request.time"
  })
}

mutation DeleteFeedback($id: UUID!) @auth(level: USER) {
  feedback_delete(key: { id: $id })
}

query ListFeedbackForFeature($featureId: UUID!) @auth(level: PUBLIC, insecureReason: "Public feedback display.") {
  feedbacks(where: { featureId: { eq: $featureId } }) {
    content
    rating
  }
}

mutation AssignDeveloper($bugReportId: UUID!, $developerId: UUID!) @auth(level: USER) {
  assignment_insert(data: {
    bugReportId: $bugReportId,
    developerId: $developerId,
    assignedAt_expr: "request.time"
  })
}

mutation UnassignDeveloper($id: UUID!) @auth(level: USER) {
  assignment_delete(key: { id: $id })
}

query ListAssignments @auth(level: USER) {
  assignments {
    developer { displayName }
    bugReport { title }
  }
}